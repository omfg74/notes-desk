[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-desk"
version = "0.2.0"
description = "Локальный harness для текстовых заметок"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alexander Podshivalov" }]
dependencies = ["pywebview>=6.2.1,<7"]

[project.scripts]
notes-desk = "notes_desk.__main__:main"

[tool.setuptools]
packages = ["notes_desk"]

[tool.setuptools.package-data]
notes_desk = ["static/*"]
